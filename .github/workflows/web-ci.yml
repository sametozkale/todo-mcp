name: Web CI

on:
  push:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Unit tests
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
        env:
          # Public-only placeholders so forks build without repo secrets (runtime calls are not exercised in build).
          NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_POSTHOG_KEY: phc_placeholder_ci_only
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
